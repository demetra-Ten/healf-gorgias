<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- GitHub Pages serves these with a long cache, so a fix could sit unseen behind a
     stale copy until a hard refresh. Ask the browser to revalidate each load. -->
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Healf Support Training</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-size: 13px;
  background: #f7f5f3;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
.card {
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  width: 380px;
  padding: 36px 32px;
}
.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 28px;
}
.logo-mark {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: #1b1c1d;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: -0.5px;
}
.logo-text { font-size: 18px; font-weight: 700; color: #1b1c1d; }
.logo-sub { font-size: 12px; color: #a3a19e; margin-top: 1px; }
h1 { font-size: 20px; font-weight: 700; color: #1b1c1d; margin-bottom: 6px; }
p.sub { font-size: 13px; color: #706f6e; margin-bottom: 24px; }
label { display: block; font-size: 12px; font-weight: 600; color: #474646; margin-bottom: 5px; }
input {
  width: 100%;
  padding: 9px 12px;
  border: 1px solid #e8e5e2;
  border-radius: 7px;
  font-size: 13px;
  font-family: inherit;
  color: #1b1c1d;
  outline: none;
  margin-bottom: 14px;
  transition: border-color 0.15s;
}
input:focus { border-color: #1b1c1d; box-shadow: 0 0 0 3px rgba(27,28,29,0.1); }
button {
  width: 100%;
  padding: 10px;
  background: #1b1c1d;
  color: #fff;
  border: none;
  border-radius: 7px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: background 0.15s;
}
button:hover { background: #6d28d9; }
button:disabled { background: #e8e5e2; cursor: not-allowed; }
.error {
  background: #fef2f2;
  border: 1px solid #fecaca;
  color: #d9003e;
  border-radius: 7px;
  padding: 9px 12px;
  font-size: 12px;
  margin-bottom: 14px;
  display: none;
}
.footer-note {
  text-align: center;
  font-size: 11px;
  color: #a3a19e;
  margin-top: 20px;
}
.footer-note a { color: #644b9e; text-decoration: none; }

/* ── Gorgias parity: type, surfaces, elevation ─────────────────────────────
   Values sampled from healf-uk.gorgias.com (Telegraph design system):
   Inter 14px / #1b1c1d on #f7f5f3, card radius 12px,
   border rgba(31,23,12,.12), container shadow 0 2px 8px rgba(0,0,0,.04).   */
body, input, textarea, select, button, .reply-input, .actions-input {
  font-family: Inter, "Helvetica Neue", Arial, Helvetica, sans-serif;
}
.msg-card {
  border-radius: 12px;
  border: 1px solid rgba(31,23,12,.12);
  box-shadow: 0 2px 8px 0 rgba(0,0,0,.04);
}
html[data-theme="dark"] .msg-card { border-color: rgba(255,255,255,.10); box-shadow: none; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-mark">healf</div>
    <div>
      <div class="logo-text">Healf</div>
      <div class="logo-sub">Support Training</div>
    </div>
  </div>
  <h1>Welcome back</h1>
  <p class="sub">Sign in to continue your training.</p>
  <div class="error" id="error-msg"></div>
  <label for="email">Email address</label>
  <input type="email" id="email" placeholder="you@healf.com" autocomplete="email" />
  <label for="pin">Password</label>
  <input type="password" id="pin" placeholder="Enter password" autocomplete="current-password" />
  <button id="login-btn" onclick="login()">Sign in</button>
  <div class="footer-note"><a href="admin.html">Admin panel →</a></div>
</div>

<script>
async function login() {
  const email = document.getElementById('email').value.trim().toLowerCase();
  const pin   = document.getElementById('pin').value.trim();
  const btn   = document.getElementById('login-btn');
  const err   = document.getElementById('error-msg');
  err.style.display = 'none';

  if (!email || !pin) { showError('Please enter your email and password.'); return; }

  btn.disabled = true;
  btn.textContent = 'Signing in…';

  // Authenticate against the shared training account (gates all database access).
  const { error: authErr } = await db.auth.signInWithPassword({
    email: 'trainee-access@healf.com',
    password: pin
  });
  if (authErr) {
    showError('Incorrect password. Please try again.');
    btn.disabled = false;
    btn.textContent = 'Sign in';
    return;
  }

  // Identify the trainee by their own email address.
  const { data, error } = await db
    .from('trainees')
    .select('*')
    .eq('email', email)
    .single();

  if (error || !data) {
    showError('No account found for that email address.');
    await db.auth.signOut();
    btn.disabled = false;
    btn.textContent = 'Sign in';
    return;
  }

  localStorage.setItem('trainee', JSON.stringify(data));
  window.location.href = 'practice.html';
}

function showError(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = msg;
  el.style.display = 'block';
}

// Allow Enter key
document.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });

// Already signed in? Don't make them do it again. This runs on every visit to the
// sign-in page, so a refresh, a new tab or reopening the browser lands straight in
// the inbox. It needs BOTH a live session and a remembered trainee: a session with
// no trainee (e.g. someone who signed into the admin panel on this browser) must
// still be asked who they are.
(async () => {
  try {
    const stored = localStorage.getItem('trainee');
    if (!stored) return;
    const { data: { session } } = await db.auth.getSession();
    if (session) window.location.replace('practice.html');
  } catch (e) { /* fall through to the form */ }
})();
</script>
</body>
</html>
