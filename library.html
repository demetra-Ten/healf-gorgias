<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Healf Learning · CW training library</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231b1c1d'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' transform='translate(4 4)'%3E%3Crect x='5' y='4' width='4' height='16' rx='1'/%3E%3Crect x='9' y='4' width='4' height='16' rx='1'/%3E%3Cpath d='m14 4.5 3-.7 3.7 13.4-3 .8z'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,300;6..72,400&display=swap" rel="stylesheet">

<script src="supabase.js"></script>
<script>document.documentElement.setAttribute('data-theme', (function () { try { return localStorage.getItem('healf_theme') || 'light'; } catch (e) { return 'light'; } })());</script>
<!-- The shared Healf Learning design (sidebar shell, type, colours). The simulators never load it. -->
<link rel="stylesheet" href="healf-learning.css?v=2026-10-28b">
<style>
/* Library-only pieces on top of healf-learning.css: tool cards, section boxes and the sign-in card. */
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--hl-bg); color: var(--hl-ink); font-family: var(--hl-font); font-size: 14px; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
.hidden { display: none !important; }
.tile { width: 32px; height: 32px; border-radius: 8px; background: var(--hl-ink); color: var(--hl-surface); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.tile svg { width: 18px; height: 18px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.tool { padding: 20px; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
.tool-head { display: flex; align-items: center; gap: 12px; }
.tool h2 { font-size: 15px; font-weight: 600; line-height: 1.3; margin-top: 6px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tool p { color: var(--hl-ink-2); line-height: 1.55; flex: 1; font-size: 13.5px; }
.tool .open { font-weight: 600; font-size: 13px; color: var(--hl-ink); margin-top: 4px; }
.tool.soon { border-style: dashed; box-shadow: none; }
.tool.soon .tile { opacity: .35; }
.signin-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 32px 16px; background: var(--hl-bg); }
.signin { width: 100%; max-width: 400px; padding: 28px; }
.signin .hl-brand { padding: 0 0 22px; }
.signin .hl-title { font-size: 30px; }
.signin .hl-sub { margin-bottom: 20px; }
.signin label { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 5px; }
.signin input { width: 100%; height: 40px; border: 1px solid var(--hl-line); border-radius: 9px; padding: 0 12px; font: inherit; font-size: 14px; color: var(--hl-ink); background: var(--hl-surface); outline: none; margin-bottom: 14px; }
.signin input:focus { border-color: var(--hl-accent); box-shadow: 0 0 0 3px var(--hl-accent-soft); }
.signin .hl-btn { width: 100%; justify-content: center; height: 40px; }
.signin .hl-btn:disabled { opacity: .6; cursor: default; }
.signin .err { display: none; background: var(--hl-bad-bg); color: var(--hl-bad); border-radius: 9px; padding: 9px 12px; font-size: 12.5px; margin-bottom: 14px; }
.signin-foot { margin-top: 16px; font-size: 12px; color: var(--hl-ink-3); text-align: center; }
.signin-foot a { color: var(--hl-accent); }
.who { font-size: 12px; color: var(--hl-ink-2); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 8px; }
.tiles .hl-card { padding: 14px 16px; }
.tiles .v { font-family: var(--hl-serif); font-size: 28px; line-height: 1.1; }
.tiles .l { font-size: 12px; color: var(--hl-ink-2); margin-top: 4px; }
.ptable { overflow-x: auto; }
.ptable table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 560px; }
.ptable th { text-align: left; font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--hl-ink-3); padding: 10px 16px; border-bottom: 1px solid var(--hl-line); }
.ptable td { padding: 12px 16px; border-bottom: 1px solid var(--hl-line-2); vertical-align: middle; color: var(--hl-ink); }
.ptable tr:last-child td { border-bottom: 0; }
.bar { width: 120px; height: 6px; border-radius: 3px; background: var(--hl-line-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--hl-good); }
.bar i.mid { background: var(--hl-warn); } .bar i.low { background: var(--hl-bad); }
.muted { color: var(--hl-ink-3); }
.empty { padding: 28px; text-align: center; color: var(--hl-ink-2); }
.who b { color: var(--hl-ink); }
</style>
</head>
<body>
<!-- Signed out: one centred sign-in card. -->
<div class="signin-wrap hidden" id="signin">
  <div class="signin hl-card">
    <div class="hl-brand"><b>Healf Learning</b></div>
    <h1 class="hl-title">Sign in</h1>
    <p class="hl-sub">Sign in once and every simulator and resource opens straight away.</p>
    <div class="err" id="err"></div>
    <label for="email">Email address</label>
    <input type="email" id="email" placeholder="you@healf.com" autocomplete="username">
    <label for="pin">Password</label>
    <input type="password" id="pin" placeholder="Training password" autocomplete="current-password">
    <button class="hl-btn" id="go" onclick="login()">Sign in</button>
  </div>
</div>
<!-- Signed in: the shared sidebar shell. -->
<div class="hl-shell hidden" id="app">
  <nav class="hl-side" aria-label="Healf Learning">
    <a class="hl-brand" href="#"><b>Healf Learning</b></a>
    <a class="hl-nav" href="#" data-page="">Home</a>
    <div class="hl-grp">Practise</div>
    <a class="hl-nav" href="#sim" data-page="sim">Simulators <span class="hl-count" id="c-sim"></span></a>
    <a class="hl-nav" href="#res" data-page="res">Onboarding Resources <span class="hl-count" id="c-res"></span></a>
    <div class="hl-grp">My training</div>
    <a class="hl-nav" href="#progress" data-page="progress">My progress</a>
    <div class="hl-side-foot"><div class="who" id="who"></div><a href="admin.html" target="healf-admin">Admin panel →</a></div>
  </nav>
  <main class="hl-main"><div class="hl-main-in" id="grid"></div></main>
</div>
<script>
// Add a simulator here and it appears in the library. This page is the ONLY sign-in: the
// tools send a signed-out visitor here (?next=<tool page>) and come straight back after.
// `tab` opens each tool in its own named tab (the name the tool gives itself), so a second
// click goes back to that tool's tab and Gorgias -> Shopify links keep landing in it.
// Simple line glyphs, drawn on a 24px grid and shown at 18px inside a 32px tile.
const G = {
  chat: '<path d="M4 5h16v11H9l-5 4z"/>',
  bag: '<path d="M5 8h14l-1 12H6z"/><path d="M9 8a3 3 0 0 1 6 0"/>',
  book: '<path d="M5 4h11a2 2 0 0 1 2 2v14H7a2 2 0 0 1-2-2z"/><path d="M5 18a2 2 0 0 1 2-2h11"/>',
  sheet: '<rect x="5" y="4" width="14" height="16" rx="2"/><path d="M5 10h14M10 10v10"/>',
  screen: '<rect x="3" y="5" width="18" height="12" rx="2"/><path d="M9 21h6M12 17v4"/>',
  plus: '<path d="M12 6v12M6 12h12"/>',
  chart: '<path d="M5 19V11M12 19V5M19 19v-6"/>'
};
// The library is split into sections; each tool says which one it belongs to.
// The front page shows one box per section; clicking a box opens that section's tools (#sim / #res).
const SECTIONS = [
  { key: 'sim', title: 'Simulators', glyph: 'screen', sub: 'Practise safely on copies of the real tools',
    blurb: 'Safe copies of Gorgias and Shopify, filled with real (anonymised) tickets and orders. Nothing you do touches live customers.' },
  { key: 'res', title: 'Onboarding Resources', glyph: 'book', sub: 'The documents and courses you use during training',
    blurb: 'Trainual and the Ticket Training Document, the places you learn the SOPs and log your practice tickets.' },
];
const TOOLS = [
  { section: 'sim', name: 'Gorgias Simulator', glyph: 'chat', live: true, href: 'practice.html', tab: 'healf-gorgias',
    blurb: 'Work real customer tickets: read the thread, choose the macro, write the reply and log your actions. Every ticket is marked with feedback.' },
  { section: 'sim', name: 'Shopify Simulator', glyph: 'bag', live: true, href: 'shopify.html', tab: 'healf-shopify',
    blurb: 'Look up orders, customers, stock and ETAs as they were on the day, then cancel, refund, edit or raise Manual Orders. Opens from any Gorgias ticket too.' },
  // Not a simulator: the shared Google Sheet new joiners and buddies log and score practice
  // tickets in. Kept here so it's one click away during training.
  { section: 'res', name: 'Ticket Training Document', glyph: 'sheet', live: true, tag: 'Google Sheet', open: 'Open the document',
    href: 'https://docs.google.com/spreadsheets/d/1e7OSPyfEROS5pQTg3OrSkemazH2rxMAxeVnGM2AO2Jg/edit', tab: 'healf-ticket-doc',
    blurb: 'Log each ticket you work on your own tab: the link, contact reason and your process. Your buddy scores it and leaves feedback there.' },
  { section: 'res', name: 'Trainual', glyph: 'book', live: true, tag: 'Course', open: 'Open Trainual',
    href: 'https://app.trainual.com/76117bb1-e231-46bd-b8e3-6e10205b5ccc', tab: 'healf-trainual',
    blurb: 'Your CW learning path and SOPs: every process, macro and policy, with quizzes to check what you have learned.' },
  { section: 'sim', name: 'More simulators', glyph: 'plus', live: false,
    blurb: 'More CW tools are on the way, so you can practise the whole journey in one place.' }
];
window.name = 'healf-library';   // the tools' "All training tools" links come back to this tab
const svg = g => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${G[g]}</svg>`;
const card = t => t.live ? `
  <a class="hl-card tool" href="${t.href}" target="${t.tab}">
    <div class="tile">${svg(t.glyph)}</div><h2>${t.name}</h2>
    <p>${t.blurb}</p><span class="open">${t.open || 'Open'} →</span></a>` : `
  <div class="hl-card tool soon">
    <div class="tile">${svg(t.glyph)}</div><h2>${t.name} <span class="hl-pill muted">Coming soon</span></h2>
    <p>${t.blurb}</p></div>`;
SECTIONS.forEach(x => { const n = TOOLS.filter(t => t.section === x.key && t.live).length; const el = document.getElementById('c-' + x.key); if (el) el.textContent = n; });
let whoName = '';
function greeting() { const h = new Date().getHours(); return h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening'; }
// ── My progress: built from the user's own simulator submissions, plus their onboarding week ──
// (my_training_week only returns week + phase for the linked user; reviews and KPIs stay admin-only).
let me = null, prog = null;
async function loadProgress() {
  if (!me || !me.id) return;
  const [subs, cats, wk] = await Promise.all([
    db.from('submissions').select('ticket_id, score, trainer_score, submitted_at, tickets(subject, category_id)').eq('trainee_id', me.id).order('submitted_at', { ascending: false }),
    db.from('categories').select('id, name, order_index').order('order_index'),
    db.rpc('my_training_week', { p_trainee_id: me.id }).then(r => r, () => ({ data: null }))
  ]);
  const eff = s => (s.trainer_score != null && s.trainer_score !== '') ? Number(s.trainer_score) : (s.score != null ? Number(s.score) : null);
  const seen = new Set(), latest = [];
  for (const s of (subs.data || [])) { if (seen.has(s.ticket_id)) continue; seen.add(s.ticket_id); latest.push(Object.assign({}, s, { eff: eff(s) })); }
  const categories = (cats.data || []).filter(c => c.id !== 7);
  const byCat = categories.map(c => {
    const rows = latest.filter(s => s.tickets && s.tickets.category_id === c.id), scored = rows.filter(s => s.eff != null);
    return { id: c.id, name: c.name, done: rows.length, scored: scored.length,
      avg: scored.length ? scored.reduce((a, s) => a + s.eff, 0) / scored.length : null,
      threes: scored.filter(s => s.eff === 3).length, last: rows[0] ? rows[0].submitted_at : null };
  });
  const w = Array.isArray(wk && wk.data) ? wk.data[0] : (wk && wk.data);
  // Next up: their assigned topic if Demetra set one, else the weakest topic practised, else the first not started.
  let next = categories.find(c => c.id === me.current_category_id);
  if (!next) { const tried = byCat.filter(c => c.scored).sort((a, b) => a.avg - b.avg); next = (tried[0] && tried[0].avg < 2.5) ? tried[0] : byCat.find(c => !c.done) || tried[0]; }
  prog = { latest, byCat, week: w && w.week, phase: w && w.phase, next, goal: w || {} };
  renderLibrary();
}
const phaseName = p => ({ onboarding: 'Onboarding', buddying: 'Buddying', probation: 'Probation', passed: 'Probation ended' })[p] || '';
const esc = v => String(v == null ? '' : v).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function homeLine() {
  if (!prog) return 'Practise on safe copies of the tools you\'ll use every day, and find the training documents you need along the way. Nothing in the simulators touches live customers.';
  const bits = [];
  const w = prog.week, g = prog.goal;
  if (w >= 1 && w <= 10) bits.push(`Week ${w} of 10`);
  if (w >= 1 && prog.phase) bits.push(phaseName(prog.phase));
  // Weeks 1-2 (onboarding): what to practise next. Weeks 3-10: that week's KPI goal instead,
  // since every topic has been covered by the end of onboarding.
  if (w >= 3 && w <= 10) {
    const goal = [];
    if (g.goal_messages) goal.push(`${g.goal_messages} messages${g.min_messages && g.min_messages !== g.goal_messages ? ` (min ${g.min_messages})` : ''}`);
    if (g.quality_target_pct) goal.push(`${g.quality_target_pct}% of tickets scored 3`);
    if (g.qa_mentions_max_pct) goal.push(`QA mentions under ${g.qa_mentions_max_pct}%`);
    if (goal.length) bits.push(`this week's goal: ${goal.join(', ')}`);
  } else if (prog.next) bits.push(`next up: ${esc(prog.next.name)} practice`);
  return bits.length ? bits.join(' · ') : 'Pick a simulator below to start practising.';
}
function progressHtml() {
  if (!prog) return `<div class="hl-head"><div><h1 class="hl-title">My progress</h1><p class="hl-sub">Loading your practice so far…</p></div></div>`;
  const sc = prog.latest.filter(s => s.eff != null);
  const avg = sc.length ? (sc.reduce((a, s) => a + s.eff, 0) / sc.length).toFixed(2) : '–';
  const pct3 = sc.length ? Math.round(100 * sc.filter(s => s.eff === 3).length / sc.length) + '%' : '–';
  const topics = prog.byCat.filter(c => c.done).length;
  const lvl = a => a == null ? '' : a >= 2.5 ? '' : a >= 2 ? 'mid' : 'low';
  const rows = prog.byCat.map(c => `<tr>
      <td><b>${esc(c.name)}</b>${prog.next && prog.next.id === c.id && !(prog.week >= 3) ? ' <span class="hl-pill">Practise next</span>' : ''}</td>
      <td>${c.done || '<span class="muted">Not started</span>'}</td>
      <td>${c.avg == null ? '<span class="muted">–</span>' : c.avg.toFixed(2) + ' / 3'}</td>
      <td>${c.scored ? `<div class="bar"><i class="${lvl(c.avg)}" style="width:${Math.round(100 * c.threes / c.scored)}%"></i></div>` : ''}</td>
      <td>${c.scored ? Math.round(100 * c.threes / c.scored) + '%' : ''}</td>
      <td class="muted">${c.last ? new Date(c.last).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) : ''}</td></tr>`).join('');
  const recent = prog.latest.slice(0, 8).map(s => `<tr><td>${esc(s.tickets ? s.tickets.subject : 'Ticket')}</td>
      <td class="muted">${esc((prog.byCat.find(c => s.tickets && c.id === s.tickets.category_id) || {}).name || '')}</td>
      <td>${s.eff == null ? '<span class="hl-pill muted">Marking</span>' : `<span class="hl-pill ${s.eff === 3 ? 'good' : s.eff === 2 ? 'warn' : 'bad'}">${s.eff} / 3</span>`}</td>
      <td class="muted">${new Date(s.submitted_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })}</td></tr>`).join('');
  return `<div class="hl-head"><div><h1 class="hl-title">My progress</h1><p class="hl-sub">${homeLine()}</p></div>
      <a class="hl-btn" href="practice.html" target="healf-gorgias">Practise now →</a></div>
    <div class="tiles">
      <div class="hl-card"><div class="v">${prog.latest.length}</div><div class="l">Tickets practised</div></div>
      <div class="hl-card"><div class="v">${avg}</div><div class="l">Average score (out of 3)</div></div>
      <div class="hl-card"><div class="v">${pct3}</div><div class="l">Tickets scored 3</div></div>
      <div class="hl-card"><div class="v">${topics} / ${prog.byCat.length}</div><div class="l">Topics practised</div></div>
    </div>
    <div class="hl-h2">By topic <span>your latest attempt at each ticket</span></div>
    <div class="hl-card ptable"><table><thead><tr><th>Topic</th><th>Tickets</th><th>Average</th><th colspan="2">Scored 3</th><th>Last practised</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="hl-h2">Recent tickets</div>
    <div class="hl-card ptable">${recent ? `<table><thead><tr><th>Ticket</th><th>Topic</th><th>Score</th><th>Sent</th></tr></thead><tbody>${recent}</tbody></table>` : '<div class="empty">Nothing practised yet. Open the Gorgias Simulator to work your first ticket.</div>'}</div>`;
}
function renderLibrary() {
  const isProg = location.hash === '#progress';
  const sec = SECTIONS.find(x => '#' + x.key === location.hash);
  document.querySelectorAll('.hl-nav[data-page]').forEach(n => n.classList.toggle('on', n.dataset.page === (isProg ? 'progress' : sec ? sec.key : '')));
  if (isProg) { document.getElementById('grid').innerHTML = progressHtml(); window.scrollTo(0, 0); return; }
  if (!sec) {
    const first = (whoName || '').split(' ')[0];
    document.getElementById('grid').innerHTML = `<div class="hl-head"><div>
        <h1 class="hl-title">${greeting()}${first ? ', ' + first.replace(/[<>&]/g, '') : ''}</h1>
        <p class="hl-sub">${homeLine()}</p></div></div>
      <div class="grid">${SECTIONS.map(x => {
        const n = TOOLS.filter(t => t.section === x.key && t.live).length;
        return `<a class="hl-card tool" href="#${x.key}">
          <div class="tile">${svg(x.glyph)}</div><h2>${x.title}</h2>
          <p>${x.blurb}</p><span class="open">View ${n} ${n === 1 ? 'item' : 'items'} →</span></a>`;
      }).join('')}</div>`;
  } else {
    document.getElementById('grid').innerHTML = `<div class="hl-head"><div><h1 class="hl-title">${sec.title}</h1><p class="hl-sub">${sec.sub}</p></div></div>
      <div class="grid">${TOOLS.filter(t => t.section === sec.key).map(card).join('')}</div>`;
  }
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', renderLibrary);
renderLibrary();

// ── The one sign-in for every simulator ─────────────────────────────────────
// Every trainee authenticates through one shared account and is identified by their own
// email; the session lives in localStorage and refreshes itself, so it survives reloads,
// new tabs and browser restarts. Only "Sign out of all tools" (or a tool's sign-out) ends it.
const TRAINEE_ACCOUNT = 'trainee-access@healf.com';
const $id = x => document.getElementById(x);
function nextUrl() {
  const n = new URLSearchParams(location.search).get('next') || '';
  return /^(practice|shopify|tracking)\.html([?#].*)?$/.test(n) ? n : '';
}
function showTiles(who) {
  $id('signin').classList.add('hidden'); $id('app').classList.remove('hidden');
  whoName = String(who.name || '');
  me = who; loadProgress();
  $id('who').innerHTML = `Signed in as <b>${whoName.replace(/[<>&]/g, '')}</b><br><button onclick="signOut()">Sign out of all tools</button>`;
  renderLibrary();
}
function showSignIn() {
  $id('app').classList.add('hidden'); $id('signin').classList.remove('hidden'); $id('who').innerHTML = '';
  setTimeout(() => $id('email').focus(), 30);
}
function showError(m) { const e = $id('err'); e.textContent = m; e.style.display = 'block'; }
async function login() {
  const email = $id('email').value.trim().toLowerCase(), pin = $id('pin').value.trim(), btn = $id('go');
  $id('err').style.display = 'none';
  if (!email || !pin) { showError('Please enter your email and password.'); return; }
  btn.disabled = true; btn.textContent = 'Signing in…';
  const { error: authErr } = await db.auth.signInWithPassword({ email: TRAINEE_ACCOUNT, password: pin });
  if (authErr) { showError('Incorrect password. Please try again.'); btn.disabled = false; btn.textContent = 'Sign in'; return; }
  const { data, error } = await db.from('trainees').select('*').eq('email', email).single();
  if (error || !data) { showError('No account found for that email address.'); await db.auth.signOut(); btn.disabled = false; btn.textContent = 'Sign in'; return; }
  localStorage.setItem('trainee', JSON.stringify(data));
  const n = nextUrl();
  if (n) { location.replace(n); return; }
  btn.disabled = false; btn.textContent = 'Sign in';
  showTiles(data);
}
$id('pin').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
$id('email').addEventListener('keydown', e => { if (e.key === 'Enter') $id('pin').focus(); });
async function signOut() {
  try { localStorage.removeItem('trainee'); await db.auth.signOut(); } catch (e) {}
  showSignIn();
}
(async () => {
  try {
    // ?signin is the way back to the form from a borrowed or broken session.
    if (new URLSearchParams(location.search).has('signin')) { await signOut(); return; }
    const who = JSON.parse(localStorage.getItem('trainee') || 'null');
    const { data: { session } } = await db.auth.getSession();
    if (who && who.id && session && session.user.email === TRAINEE_ACCOUNT) {
      const n = nextUrl();
      if (n) { location.replace(n); return; }
      showTiles(who); return;
    }
  } catch (e) {}
  showSignIn();
})();
</script>
</body>
</html>
