<style>
/* Modelled on Healf's live Recharge merchant portal (how2go-sp.admin.rechargeapps.com, Nov 2026).
   This is a copy of the real tool: never restyle it with the Healf Learning design. */
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f7f6f3; --side: #f7f6f3; --card: #fff; --line: #e6e3dd; --line-2: #efece7;
  --ink: #1d1d1b; --ink-2: #5c5a55; --ink-3: #8b8882; --chip: #ebe8e2; --soft: #f5f2ee; --hover: #eeebe5;
  --blue: #0b3df5; --blue-ink: #0a33cc; --row-sel: #dfe7ff;
  --green: #1a9e75; --amber: #f2b33d; --red: #d92d20; --red-bg: #fbb7a5;
}
html, body { height: 100%; }
body { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; line-height: 20px; color: var(--ink); background: var(--bg); display: flex; overflow: hidden; -webkit-font-smoothing: antialiased; }
a { color: inherit; } button { font: inherit; color: inherit; cursor: pointer; background: none; border: none; }
input, select, textarea { font: inherit; color: var(--ink); }
svg { flex-shrink: 0; }
.serif { font-family: 'Source Serif 4', Georgia, serif; font-weight: 400; }
.mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }

/* ── sidebar ── */
.side { width: 264px; flex-shrink: 0; display: flex; flex-direction: column; padding: 22px 12px 14px; border-right: 1px solid var(--line); background: var(--side); overflow-y: auto; }
.brand { display: flex; align-items: center; justify-content: space-between; padding: 0 8px 18px; }
.brand .logo { display: flex; align-items: center; gap: 6px; color: var(--blue); font-weight: 700; font-size: 22px; letter-spacing: -.6px; font-style: italic; }
.brand .logo i { width: 22px; height: 22px; border-radius: 50%; background: var(--blue); display: inline-flex; align-items: center; justify-content: center; color: #fff; font-style: normal; font-size: 12px; }
.brand .col { color: var(--ink-3); width: 18px; height: 18px; }
.sbox { display: flex; align-items: center; gap: 10px; height: 40px; border: 1px solid #cfccc6; border-radius: 6px; background: #fff; padding: 0 12px; color: var(--ink-3); margin-bottom: 8px; cursor: text; }
.sbox span { flex: 1; } .sbox kbd { font: inherit; font-size: 13px; color: var(--ink); }
.nv { display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 10px; border-radius: 6px; color: var(--ink); cursor: pointer; font-size: 15px; }
.nv svg.i { width: 20px; height: 20px; color: var(--ink-2); }
.nv .chev { margin-left: auto; width: 16px; height: 16px; color: var(--ink-2); transition: transform .15s; }
.nv:hover { background: var(--hover); }
.nv.on { background: var(--hover); }
.nv.dim { cursor: default; }
.grp.open > .nv { background: #f1eee9; border-radius: 6px 6px 0 0; }
.grp.open > .nv .chev { transform: rotate(180deg); }
.grp .sub { display: none; background: #f1eee9; border-radius: 0 0 6px 6px; padding: 0 4px 6px; }
.grp.open .sub { display: block; }
.sub .nv { height: 32px; font-size: 14.5px; padding-left: 40px; position: relative; }
.sub .nv.on::before { content: ''; position: absolute; left: 22px; top: 6px; width: 10px; height: 10px; border-left: 1.6px solid var(--ink); border-bottom: 1.6px solid var(--ink); border-bottom-left-radius: 6px; }
.sub .nv.on { background: #e6e2dc; }
.sep { height: 1px; background: var(--line); margin: 10px 4px; }
.spacer { flex: 1; min-height: 20px; }
.store { display: flex; align-items: center; gap: 12px; background: #efece7; border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; cursor: pointer; position: relative; }
.store .av { width: 32px; height: 32px; border-radius: 50%; background: #5b62c9; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; }
.store b { display: block; font-weight: 600; font-size: 14px; } .store small { color: var(--ink-2); font-size: 12.5px; }
.train { margin: 0 4px 10px; padding: 10px 12px; border-radius: 6px; background: #fff8e1; border: 1px solid #f1dfa8; font-size: 12.5px; line-height: 17px; color: #5b4a12; }
.menu { display: none; position: absolute; background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 12px 32px rgba(20,20,20,.14); padding: 6px; z-index: 40; min-width: 220px; }
.menu.open { display: block; }
.menu button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 9px 10px; border-radius: 6px; font-size: 14.5px; }
.menu button svg { width: 18px; height: 18px; color: var(--ink-2); }
.menu button:hover { background: var(--soft); }
.menu button.danger, .menu button.danger svg { color: var(--red); }
.menu button.off { color: var(--ink-3); cursor: default; } .menu button.off svg { color: var(--ink-4, #bbb); } .menu button.off:hover { background: none; }

/* ── main ── */
.main { flex: 1; overflow-y: auto; }
.page { max-width: 1210px; margin: 0 auto; padding: 26px 28px 60px; }
.ph { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; min-height: 48px; }
.ph h1 { font-family: 'Source Serif 4', Georgia, serif; font-weight: 400; font-size: 32px; line-height: 40px; letter-spacing: -.2px; }
.ph .back { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: #fff; display: flex; align-items: center; justify-content: center; }
.ph .r { margin-left: auto; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 16px; border-radius: 999px; border: 1px solid #d7d3cc; background: #fff; font-weight: 600; font-size: 14px; white-space: nowrap; }
.btn:hover { background: var(--soft); }
.btn.pri { background: var(--blue); border-color: var(--blue); color: #fff; } .btn.pri:hover { background: var(--blue-ink); }
.btn.red { background: var(--red); border-color: var(--red); color: #fff; }
.btn.grey { background: var(--chip); border-color: var(--chip); }
.btn.sm { height: 30px; padding: 0 12px; font-size: 13.5px; }
.btn:disabled { opacity: .5; cursor: default; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 22px; }
.card > .hd { display: flex; align-items: center; padding: 18px 24px; border-bottom: 1px solid var(--line); }
.card > .hd h2 { font-family: 'Source Serif 4', Georgia, serif; font-weight: 400; font-size: 22px; line-height: 28px; }
.card > .hd .r { margin-left: auto; }
.pad { padding: 20px 24px; }
.circ { width: 32px; height: 32px; border-radius: 50%; background: #f1eee9; display: inline-flex; align-items: center; justify-content: center; color: var(--ink); }
.circ:hover { background: #e6e2dc; } .circ svg { width: 16px; height: 16px; transition: transform .15s; }
.kebab { width: 32px; height: 32px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; }
.kebab:hover, .kebab.lit { background: #e6e2dc; } .kebab svg { width: 18px; height: 18px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 24px; align-items: start; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-bottom: 22px; }
.stat { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 22px 18px 18px; }
.stat .k { font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: .3px; color: var(--ink-2); text-decoration: underline dotted; text-underline-offset: 4px; text-transform: uppercase; }
.stat .v { font-family: 'IBM Plex Mono', monospace; font-size: 34px; line-height: 44px; margin-top: 12px; }
.banner { display: flex; gap: 14px; background: var(--red-bg); border-radius: 12px; padding: 18px 24px; margin-bottom: 22px; }

/* address card */
.addr-h { padding: 18px 24px 0; display: flex; align-items: flex-start; gap: 12px; }
.addr-h h3 { font-family: 'Source Serif 4', Georgia, serif; font-weight: 400; font-size: 22px; line-height: 30px; }
.addr-h p { color: var(--ink); margin-top: 4px; }
.addr-h .r { margin-left: auto; display: flex; gap: 10px; align-items: center; position: relative; }
.pills { display: flex; gap: 8px; flex-wrap: wrap; padding: 14px 24px 12px; border-bottom: 1px solid var(--line); }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; background: var(--chip); border-radius: 4px; font-size: 14.5px; }
.pill b { font-weight: 600; }
table.t { width: 100%; border-collapse: collapse; }
table.t th { text-align: left; font-weight: 400; color: var(--ink-2); padding: 12px 12px; border-bottom: 1px solid var(--line); font-size: 14.5px; white-space: nowrap; }
table.t td { padding: 12px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; font-size: 14.5px; }
table.t tr:last-child td { border-bottom: none; }
table.t th:first-child, table.t td:first-child { padding-left: 24px; }
table.t th:last-child, table.t td:last-child { padding-right: 16px; }
table.t tr.click { cursor: pointer; } table.t tr.click:hover td { background: #faf9f6; }
table.t tr.sel td { background: var(--row-sel); }
.num { text-align: right; }
.cb { width: 18px; height: 18px; border: 1.5px solid #b9b5ae; border-radius: 4px; display: inline-block; vertical-align: middle; background: #fff; }
.prod { display: flex; gap: 14px; align-items: center; }
.thumb { width: 52px; height: 52px; border-radius: 4px; background: #f3f1ed; border: 1px solid var(--line-2); object-fit: contain; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: var(--ink-3); }
.prod b { font-weight: 500; display: block; }
.prod small { display: block; color: var(--ink-2); font-size: 12.5px; line-height: 16px; }
.dot { display: inline-flex; align-items: center; gap: 8px; }
.dot::before { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--green); }
.dot.ring::before { background: none; border: 1.5px solid var(--ink-2); }
.dot.grey::before { background: #8b8882; } .dot.amber::before { background: var(--amber); } .dot.red::before { background: var(--red); }
.chip { display: inline-flex; align-items: center; gap: 4px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .3px; padding: 1px 6px; border-radius: 4px; background: var(--chip); color: var(--ink-2); text-transform: uppercase; }
.chip.co { background: #0d5c46; color: #fff; }
.chip.re { background: #e1e7ff; color: #2a3fa8; }
.chip.red { background: #fde3dd; color: #a8261a; }
.idlink { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; text-decoration: underline; text-underline-offset: 3px; }
.idlink .ic { width: 22px; height: 22px; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; color: #fff; font-size: 11px; font-weight: 700; }
.ic.sh { background: #4a8c3f; } .ic.rc { background: var(--blue); }
.expand { background: #f6f4f0; padding: 14px 16px 16px; border-bottom: 1px solid var(--line); }
.exp-grid { display: grid; grid-template-columns: 1fr 200px; gap: 12px; }
.box { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
.box h4 { font-family: 'Source Serif 4', Georgia, serif; font-weight: 500; font-size: 17px; margin-bottom: 14px; }
.sumrow { display: flex; gap: 8px; padding: 6px 0; } .sumrow span:last-child { margin-left: auto; }
.sumrow.tot { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 12px; font-weight: 600; }
.meta { font-size: 12.5px; line-height: 16px; } .meta div { margin-bottom: 10px; } .meta span { display: block; color: var(--ink-2); }
.rows { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 16px; color: var(--ink); }
.rows select { height: 40px; border: 1px solid #cfccc6; border-radius: 6px; padding: 0 30px 0 12px; background: #fff; }
.rows a { text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.sbar { display: flex; gap: 14px; padding: 22px 24px 8px; flex-wrap: wrap; }
.inp { height: 40px; border: 1px solid #cfccc6; border-radius: 6px; padding: 0 12px; background: #fff; min-width: 0; }
.inp:focus { outline: 2px solid var(--blue); outline-offset: -1px; }
.addf { margin: 0 24px 12px; }
.rc-side .card .pad > .well { background: var(--soft); border-radius: 6px; padding: 14px 16px; margin-bottom: 10px; }
.well .k { color: var(--ink-2); font-size: 14px; } .well .v { margin-top: 4px; }
.well small { display: block; color: var(--ink-2); font-size: 13px; line-height: 18px; }
.btn.block { width: 100%; height: 34px; }
.tag { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; padding: 2px 6px; border-radius: 4px; background: #efece7; color: var(--ink-2); margin: 0 6px 6px 0; }
.tl { padding: 8px 24px 14px; }
.tl .ev { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line-2); }
.tl .ev:last-child { border-bottom: none; }
.tl .ev i { width: 10px; height: 10px; border-radius: 50%; background: #b9b5ae; margin-top: 5px; flex-shrink: 0; }
.tl .ev .tx { flex: 1; } .tl .ev .when { color: var(--ink-2); font-size: 13px; text-align: right; min-width: 130px; }
.empty { padding: 18px; text-align: center; color: var(--ink); }
.closed > :not(.hd) { display: none; } .card.closed > .hd { border-bottom: none; } .card.closed .circ svg { transform: rotate(180deg); }
.home-h { text-align: center; padding: 40px 0 26px; }
.home-h small { color: var(--ink-2); font-size: 16px; } .home-h h1 { font-family: 'Source Serif 4', Georgia, serif; font-weight: 400; font-size: 34px; margin-top: 6px; }
.remi { max-width: 720px; margin: 22px auto 0; background: #fff; border: 1px solid var(--line); border-radius: 8px; height: 50px; display: flex; align-items: center; padding: 0 14px; gap: 10px; color: var(--ink-3); }
.remi b { color: var(--ink); }

/* modal */
.ov { position: fixed; inset: 0; background: rgba(30,28,25,.35); display: flex; align-items: center; justify-content: center; z-index: 60; }
.md { background: #fff; border-radius: 14px; width: 672px; max-width: calc(100vw - 32px); max-height: calc(100vh - 60px); display: flex; flex-direction: column; box-shadow: 0 30px 60px rgba(0,0,0,.2); }
.md .mh { display: flex; align-items: center; padding: 26px 24px 8px; }
.md .mh h3 { font-family: 'Source Serif 4', Georgia, serif; font-weight: 400; font-size: 26px; }
.md .mh button { margin-left: auto; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.md .mh button:hover { background: var(--soft); }
.md .mb { padding: 8px 24px 22px; overflow-y: auto; }
.md .mf { display: flex; justify-content: flex-end; gap: 10px; padding: 18px 24px; border-top: 1px solid var(--line); }
.fl { display: block; font-weight: 500; margin: 14px 0 6px; }
.fl:first-child { margin-top: 4px; }
.md .inp, .md select.inp, .md textarea.inp { width: 100%; }
.md textarea.inp { height: 80px; padding: 10px 12px; resize: vertical; }
.hint { color: var(--ink-2); font-size: 13px; margin-top: 6px; }
.warn { background: #fff4e5; border: 1px solid #f6d29b; border-radius: 8px; padding: 12px 14px; margin-top: 12px; font-size: 13.5px; color: #6b4300; }
.pick { border: 1px solid var(--line); border-radius: 8px; margin-top: 10px; max-height: 300px; overflow-y: auto; }
.pick .it { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line-2); cursor: pointer; }
.pick .it:last-child { border-bottom: none; } .pick .it:hover, .pick .it.on { background: var(--row-sel); }
.pick .it .thumb { width: 40px; height: 40px; }
.pick .it .p { margin-left: auto; white-space: nowrap; }
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: #1d1d1b; color: #fff; padding: 10px 16px; border-radius: 8px; opacity: 0; transition: .2s; z-index: 80; pointer-events: none; }
.toast.on { opacity: 1; transform: translateX(-50%); }
#loading { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; color: var(--ink-2); z-index: 90; }
.fab { position: fixed; right: 18px; bottom: 18px; width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg, #5d7bff, #8a5bff); display: flex; align-items: center; justify-content: center; color: #fff; box-shadow: 0 4px 14px rgba(70,80,255,.35); }
@media (max-width: 1100px) { .grid2 { grid-template-columns: 1fr; } }
@media (max-width: 760px) { .side { display: none; } .stats { grid-template-columns: 1fr; } .page { padding: 18px 16px 50px; } }
</style>

  <div class="nv dim" onclick="soon()"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/></svg>Loyalty<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m7 10 5 5 5-5"/></svg></div>
  <div class="nv dim" onclick="soon()"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="10" r="2.5"/><path d="M7.5 18c1-2.3 2.6-3.5 4.5-3.5s3.5 1.2 4.5 3.5"/></svg>Churn tools<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m7 10 5 5 5-5"/></svg></div>
  <div class="spacer"></div>
  <div class="train" id="side-train"></div>
  <div style="position:relative">
    <div class="store" onclick="toggleMenu(event,'acct')" title="Account">
      <span class="av">H</span><div><b>Healf</b><small>how2go.myshopify.com</small></div>
    </div>
    <div class="menu" id="acct" style="left:0;bottom:64px;width:240px">
      <div style="padding:6px 10px 10px;border-bottom:1px solid var(--line-2);margin-bottom:4px"><div style="font-weight:600" id="acct-name"></div><div style="color:var(--ink-2);font-size:13px" id="acct-email"></div></div>
      <button onclick="window.open('practice.html','healf-gorgias')">Open the Gorgias simulator</button>
      <button onclick="window.open('shopify.html','healf-shopify')">Open the Shopify simulator</button>
      <button onclick="window.open('library.html','healf-library')">All training tools</button>
      <button class="danger" onclick="logOut()">Log out</button>
    </div>
  </div>
</aside>

<main class="main" id="scroll"><div class="page" id="page"></div></main>
<button class="fab" title="Remi is not part of the training copy" onclick="soon()"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8z"/></svg></button>
<div id="modal-root"></div>
<div class="toast" id="toast"></div>

<script>
// This tab is "Recharge": the Gorgias sim opens its Recharge links in the window with this name.
window.name = 'healf-recharge';

// ── State ─────────────────────────────────────────────────────────────────
// Every customer and subscription here is built from a Subscription ticket (sim-shared.js
// rcModel): fake names, fake ids, fake #H- order numbers. Nothing touches the real Recharge.
let trainee = null;
let tickets = [];        // Subscription tickets this trainee can see = the customers in this store
let actions = [];        // this trainee's recharge_actions
let ctxId = null;        // the ticket open in the Gorgias sim
let tableMissing = false;
const productCache = {};

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const $ = id => document.getElementById(id);
const tById = id => tickets.find(t => t.id === Number(id));
const jsq = s => String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
const model = t => rcModel(t, actions);
const gbp = n => '£' + (Number(n) || 0).toFixed(2) + ' GBP';
const isoDay = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
function stamp(d) { return d ? rcDay(d) + '<br>' + d.toLocaleTimeString('en-GB', { hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: true }).replace(' ', '').toUpperCase() + ' GMT' : ''; }
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 2600); }
function soon() { toast('Not part of the Recharge training copy'); }

const I = {
  back: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>',
  chev: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m7 14.5 5-5 5 5"/></svg>',
  down: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m7 10 5 5 5-5"/></svg>',
  dots: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5.5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="18.5" r="1.7"/></svg>',
  plus: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.5"/><path d="M12 8v8M8 12h8"/></svg>',
  ext: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
  copy: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>',
  pen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5.5l4 4L9 19H5v-4z"/></svg>',
  cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>',
  swap: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 8h14l-3-3M20 16H6l3 3"/></svg>',
  pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s-6-5.5-6-11a6 6 0 0 1 12 0c0 5.5-6 11-6 11z"/><circle cx="12" cy="10" r="2"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.5"/><path d="m9 9 6 6M15 9l-6 6"/></svg>',
  bin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4.5 7h15M9 7V4.5h6V7M6.5 7l1 13h9l1-13M10 11v5M14 11v5"/></svg>',
  skip: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M6 5.5v13l9-6.5zM18 5.5v13"/></svg>',
  ok: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.5"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>',
  gift: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.5"/><path d="M12 8v8M8 12h8"/></svg>',
  eye: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/></svg>',
  play: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.5"/><path d="m10 8.5 5 3.5-5 3.5z"/></svg>',
  close: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  info: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16v.5"/></svg>',
  img: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>'
};

// ── Data loading ──────────────────────────────────────────────────────────
async function loadProducts(ids) {
  const need = [...new Set(ids.filter(Boolean).map(String))].filter(id => !productCache[id]);
  for (let i = 0; i < need.length; i += 100) {
    const { data } = await db.from('shop_products').select('id,title,image_url,vendor,variants').in('id', need.slice(i, i + 100));
    (data || []).forEach(p => { productCache[String(p.id)] = p; });
  }
}
async function loadActions() {
  const { data, error } = await db.from('recharge_actions').select('*').eq('trainee_id', trainee.id).order('created_at');
  tableMissing = !!error;
  actions = error ? [] : (data || []);
}
async function init() {
  const stored = localStorage.getItem('trainee');
  const { data: { session } } = await db.auth.getSession();
  if (!stored || !session) {
    location.replace('library.html?next=' + encodeURIComponent('recharge.html' + location.search + location.hash));
    return;
  }
  trainee = JSON.parse(stored);
  $('acct-name').textContent = trainee.name; $('acct-email').textContent = trainee.email;
  // Recharge only knows subscribers: the Subscription (category 5) tickets with an order history.
  let q = db.from('tickets').select('*').eq('category_id', 5);
  if (trainee.current_category_id && Number(trainee.current_category_id) !== 5) q = q.eq('id', -1);
  const { data: tix } = await q;
  tickets = (tix || []).filter(t => rcModel(t, []));
  await loadActions();
  await loadProducts(tickets.map(t => (subscribedProduct(t) || {}).productId));
  setCtx(new URLSearchParams(location.search).get('t') || localStorage.getItem('shop_ctx'));
  $('loading').style.display = 'none';
  if (!location.hash) location.hash = ctxId ? '#/customers/' + ctxId : '#/customers';
  route();
}
// The Gorgias sim tells us which ticket is open; follow it live (same key as the Shopify sim).
function setCtx(id) {
  const t = id && tById(id);
  ctxId = t ? t.id : null;
  const m = t && model(t);
  $('side-train').innerHTML = t
    ? `Training copy · working on <b>${esc(t.customer_name)}</b><br>Subscriptions as at <b>${rcDay(m.asAt)}</b>`
    : 'Training copy of Recharge. Nothing here touches the real Recharge, but everything you do is recorded against your ticket and marked.';
}
window.addEventListener('storage', e => { if (e.key === 'shop_ctx') { setCtx(e.newValue); route(); } });

// Every action is a row; the Gorgias sim and the scorer read the same rows.
async function logAction(tid, kind, detail, summary) {
  if (tableMissing) { alert('The Recharge simulator is not set up yet (recharge-sim.sql has not been run). Nothing was saved.'); return null; }
  const { data, error } = await db.from('recharge_actions').insert({ trainee_id: trainee.id, ticket_id: tid, kind, detail, summary }).select().single();
  if (error) { alert('Could not save: ' + error.message); return null; }
  actions.push(data);
  localStorage.setItem('rc_bump', String(Date.now()));   // the Gorgias sim refreshes its Recharge panel
  closeModal(); route();
  return data;
}

// ── Router ────────────────────────────────────────────────────────────────
function go(h) { location.hash = h; }
window.addEventListener('hashchange', route);
const openRows = {};   // which order rows are expanded, by key
function route() {
  closeMenus();
  const parts = location.hash.replace(/^#\/?/, '').split('/').map(decodeURIComponent);
  const sec = parts[0] || 'customers';
  document.querySelectorAll('.nv[data-nav]').forEach(n => n.classList.toggle('on', n.dataset.nav === sec));
  if (sec === 'home') return viewHome();
  if (sec === 'customers' && parts[1]) return viewCustomer(Number(parts[1]));
  if (sec === 'subscriptions' && parts[1]) return viewSubscription(Number(parts[1]));
  if (sec === 'subscriptions') return viewSubscriptions();
  if (sec === 'orders') return viewOrders();
  return viewCustomers();
}
function closeMenus() { document.querySelectorAll('.menu.open').forEach(m => m.classList.remove('open')); document.querySelectorAll('.kebab.lit').forEach(k => k.classList.remove('lit')); }
function toggleMenu(e, id) {
  e.stopPropagation();
  const m = $(id), was = m.classList.contains('open');
  closeMenus();
  if (!was) { m.classList.add('open'); const k = e.currentTarget; if (k && k.classList.contains('kebab')) k.classList.add('lit'); }
}
document.addEventListener('click', closeMenus);
function toggleCard(btn) { btn.closest('.card').classList.toggle('closed'); }

// ── Shared bits ───────────────────────────────────────────────────────────
function thumb(m, small) {
  const p = m.product && m.productId && productCache[String(m.productId)];
  return p && p.image_url ? `<img class="thumb" src="${esc(p.image_url + (p.image_url.indexOf('?') > -1 ? '&' : '?') + 'width=120')}" alt="">` : `<span class="thumb">${I.img}</span>`;
}
function statusDot(m) { return m.deleted ? '<span class="dot red">Deleted</span>' : m.status === 'active' ? '<span class="dot">Active</span>' : '<span class="dot grey">Cancelled</span>'; }
function prodCell(m) {
  const p = m.product;
  if (!p) return '<span style="color:var(--ink-2)">No product</span>';
  return `<div class="prod">${thumb(m)}<div><b>${esc(p.title)}</b>${p.variant ? `<small>${esc(p.variant)}</small>` : ''}<small>Variant ID: ${esc(p.variantId)}</small></div></div>`;
}
function shopifyOrderHref(t, number, suffix) { return 'shopify.html?t=' + t.id + '#/orders/' + t.id + '/' + encodeURIComponent(number) + (suffix || ''); }
function openShopify(t, hash) { localStorage.setItem('shop_ctx', String(t.id)); window.open('shopify.html?t=' + t.id + hash, 'healf-shopify'); }

// The address card: the address, its pills, and the subscription line(s) on it.
function addressCard(t, m, withAdd) {
  const a = m.address;
  const subMenu = m.status === 'active' ? `
      <button onclick="openReschedule(${t.id})">${I.cal}Reschedule next order</button>
      <button onclick="openFrequency(${t.id})">${I.pen}Edit frequency</button>
      <button onclick="openEditProduct(${t.id})">${I.pen}Edit subscription product</button>
      <button onclick="openSwap(${t.id})">${I.swap}Swap</button>
      <button class="off" onclick="event.stopPropagation()">${I.plus.replace('width="16" height="16" ', '')}Add add-on</button>
      <button onclick="toast('This customer only has one address. To change it, use Edit address on the address card.')">${I.pin}Move address</button>
      <button onclick="openCancel(${t.id})">${I.x}Cancel subscription</button>
      <button class="danger" onclick="openDelete(${t.id})">${I.bin}Delete subscription</button>
      <button onclick="toast('This subscription has no line item properties')">${I.pen}Edit line item properties</button>` : m.deleted ? `
      <button class="off" onclick="event.stopPropagation()">${I.bin}This subscription was deleted</button>` : `
      <button onclick="openActivate(${t.id})">${I.play}Activate subscription</button>
      <button class="danger" onclick="openDelete(${t.id})">${I.bin}Delete subscription</button>`;
  return `<div class="card">
    <div class="addr-h"><div><h3>${esc(a.street)}</h3>
      <p>${esc([a.cityline, 'United Kingdom', m.name].join(', '))}, #${m.addressId}</p></div>
      <div class="r">${withAdd ? `<button class="btn" onclick="toast('Adding products is not part of the training copy')">${I.plus}Add product</button>` : ''}
        <button class="kebab" title="Actions" onclick="toggleMenu(event,'m-addr')">${I.dots}</button>
        <div class="menu" id="m-addr" style="right:0;top:40px">
          <button onclick="openAddress(${t.id})">${I.pen}Edit address</button>
          <button onclick="toast('No order note or attributes on this address')">${I.eye}View order note &amp; attributes</button>
        </div></div></div>
    <div class="pills">
      <span class="pill"><b>Payment method:</b> ${esc(cardOf(t))} ${I.down}</span>
      <span class="pill"><b>Shipping:</b> Dynamic ${I.down}</span>
      <span class="pill"><b>Discount:</b> None ${I.down}</span>
    </div>
    <table class="t"><thead><tr><th style="width:44px"><span class="cb"></span></th><th>Product</th><th>Next order</th><th>Frequency</th><th>Price (GBP)</th><th style="width:48px"></th></tr></thead>
    <tbody><tr>
      <td><span class="cb"></span></td>
      <td>${prodCell(m)}${m.status !== 'active' ? `<div style="margin-top:6px"><span class="chip red">${m.deleted ? 'Deleted' : 'Cancelled'}</span></div>` : ''}</td>
      <td>${m.next ? rcDay(m.next) : ''}</td>
      <td>${rcFreqText(m.freq)}</td>
      <td>${m.product ? m.product.qty + ' x ' + gbp(m.product.price) : ''}</td>
      <td style="position:relative"><button class="kebab" title="Actions" onclick="toggleMenu(event,'m-sub')">${I.dots}</button>
        <div class="menu" id="m-sub" style="right:8px;top:44px;width:270px">${subMenu}</div></td>
    </tr></tbody></table>
  </div>`;
}
function cardOf(t) { const h = Number(t.id) * 7919; return (h % 3 === 0 ? 'Shop Pay' : ['Visa', 'Mastercard'][h % 2] + ' ••••' + String(1000 + h % 9000)); }

function upcomingCard(t, m) {
  const rows = [];
  m.skipped.forEach((d, i) => { if (d > m.asAt) rows.push({ d, skipped: true, last: i === m.skipped.length - 1 }); });
  if (m.next) rows.push({ d: m.next });
  rows.sort((a, b) => a.d - b.d);
  const total = m.product ? m.product.price * m.product.qty : 0;
  const body = rows.length ? rows.map((r, i) => {
    const key = 'u' + t.id + '-' + i, open = openRows[key];
    return `<tr class="${open ? 'sel' : ''}"><td style="width:44px"><button class="circ" onclick="openRows['${key}']=!openRows['${key}'];route()">${I.chev.replace('<svg', `<svg style="transform:rotate(${open ? 0 : 180}deg)"`)}</button></td>
      <td>${rcDay(r.d)}</td><td>${r.skipped ? '<span class="dot grey">Skipped</span>' : '<span class="dot ring">Queued</span>'}</td><td class="num">${gbp(total)}</td>
      <td style="width:48px;position:relative"><button class="kebab" title="Actions" onclick="toggleMenu(event,'m-up${i}')">${I.dots}</button>
        <div class="menu" id="m-up${i}" style="right:8px;top:44px;width:230px">${r.skipped
          ? (r.last ? `<button onclick="openUnskip(${t.id})">${I.skip}Unskip delivery</button>` : `<button class="off">${I.skip}Unskip the latest skip first</button>`)
          : `<button onclick="openSkip(${t.id})">${I.skip}Skip delivery</button>
             <button onclick="openReschedule(${t.id})">${I.cal}Reschedule order</button>
             <button onclick="openProcess(${t.id})">${I.ok}Process order</button>
             <button onclick="toast('Free gifts are not part of the training copy')">${I.gift}Add free gift</button>`}</div></td></tr>
      ${open ? `<tr><td colspan="5" style="padding:0">${chargeExpand(t, m, { date: r.d, total, type: 'Recurring', chargeId: rcId(t, 1984500000 + i * 17, 900000), upcoming: true })}</td></tr>` : ''}`;
  }).join('') : `<tr><td colspan="5" class="empty">No orders found</td></tr>`;
  return `<div class="card"><div class="hd"><h2>Upcoming orders</h2><span class="r"><button class="circ" onclick="toggleCard(this)">${I.chev}</button></span></div>
    <table class="t"><thead><tr><th></th><th>Date</th><th>Status</th><th class="num">Total</th><th></th></tr></thead><tbody>${body}</tbody></table>
    <div class="rows" style="border-top:1px solid var(--line)">Rows: <select><option>10</option></select></div></div>`;
}
function chargeExpand(t, m, c) {
  const p = m.product, a = m.address;
  const lines = p ? `<div class="prod" style="margin-bottom:14px">${thumb(m)}<div style="flex:1"><b>${esc(p.title)}</b>${p.variant ? `<small>${esc(p.variant)}</small>` : ''}<small>Variant ID: ${esc(p.variantId)}</small></div><span>${p.qty} x ${gbp(p.price)}</span></div>` : '';
  const sub = c.total, tax = c.upcoming ? 0 : +(sub / 6).toFixed(2);
  return `<div class="expand"><div class="exp-grid">
    <div class="box"><h4>${c.upcoming ? 'Charge summary' : 'Order summary'}</h4>${lines}
      <div class="sumrow" style="border-top:1px solid var(--line);padding-top:12px"><span>Subtotal</span><span style="margin-left:90px;color:var(--ink-2)">1 item</span><span>${gbp(sub)}</span></div>
      <div class="sumrow"><span style="text-decoration:underline dotted">Taxes</span><span>${gbp(tax)}</span></div>
      ${c.upcoming ? '' : `<div class="sumrow"><span>Shipping</span><span style="margin-left:60px;color:var(--ink-2);font-size:13px">Free Shipping (2-3 Working Days)</span><span>£0.00 GBP</span></div>`}
      <div class="sumrow tot"><span>Total</span><span>${gbp(sub)}</span></div></div>
    <div class="box meta">
      <div><span>Charge type</span>${c.type}</div><div><span>Charge ID</span>${c.chargeId}</div>
      <div><span>Charge created at</span>${rcDay(c.upcoming ? m.asAt : c.date)}</div>
      ${c.upcoming ? '' : `<div><span>Order status</span><span class="dot" style="color:var(--ink)">Success</span></div><div><span>Payment processor</span>Shopify Payment Gateway</div>`}
      <div><span>Shipping address (${m.addressId})</span>${esc(m.name)}<br>${esc(a.street)}<br>${esc(a.cityline)}</div></div>
    </div>
    ${c.upcoming ? '' : `<div style="display:flex;gap:8px;margin-top:12px"><button class="btn sm" onclick="openShopify(tById(${t.id}),'#/orders/${t.id}/${encodeURIComponent(c.number)}/refund')">Refund in Shopify ${I.ext}</button>
      <button class="btn sm" onclick="openShopify(tById(${t.id}),'#/orders/${t.id}/${encodeURIComponent(c.number)}');toast('Orders are cancelled in Shopify')">Cancel</button></div>`}
  </div>`;
}
function recentCard(t, m) {
  const charges = m.charges.slice().reverse();
  const body = charges.length ? charges.map((c, i) => {
    const key = 'r' + t.id + '-' + i, open = openRows[key];
    return `<tr class="${open ? 'sel' : ''}"><td style="width:44px"><button class="circ" onclick="openRows['${key}']=!openRows['${key}'];route()">${I.chev.replace('<svg', `<svg style="transform:rotate(${open ? 0 : 180}deg)"`)}</button></td>
      <td style="white-space:nowrap">${rcDay(c.date)} <span class="chip ${c.type === 'CHECKOUT' ? 'co' : 're'}">${c.type === 'CHECKOUT' ? '🛒 ' : '↻ '}${c.type}</span></td>
      <td><span class="dot${c.status === 'Success' ? '' : ' grey'}">${c.status}</span></td>

let swapRows = [];
async function swapSearch(tid) {
  const q = $('sw-q').value.trim(); if (!q) return;
  let req = db.from('shop_products').select('id,title,vendor,image_url,variants').eq('status', 'active').limit(25);
  q.split(/\s+/).filter(Boolean).forEach(w => { req = req.ilike('title', '%' + w.replace(/[%_]/g, '') + '%'); });
  const { data } = await req;
  swapRows = [];
  (data || []).forEach(p => {
    productCache[String(p.id)] = productCache[String(p.id)] || p;
    const vs = (p.variants || []).length ? p.variants : [{ id: null, title: 'Default Title', price: 0 }];
    vs.forEach(v => swapRows.push({ p, v }));
  });
  $('sw-list').innerHTML = swapRows.length ? swapRows.map((r, i) => `<div class="it" onclick="swapPick=${i};document.querySelectorAll('#sw-list .it').forEach((e,k)=>e.classList.toggle('on',k===${i}));$('sw-go').disabled=false">
      ${r.p.image_url ? `<img class="thumb" src="${esc(r.p.image_url)}&width=80" alt="">` : `<span class="thumb">${I.img}</span>`}
      <div><b style="font-weight:500">${esc(r.p.title)}</b><small style="display:block;color:var(--ink-2)">${esc(r.v.title && r.v.title !== 'Default Title' ? r.v.title : r.p.vendor || '')}</small></div>
      <span class="p">${gbp(r.v.price)}</span></div>`).join('') : '<div class="empty">No products found</div>';
}
function doSwap(tid) {
  const r = swapRows[swapPick]; if (!r) return;
  const m = model(tById(tid)), variant = r.v.title && r.v.title !== 'Default Title' ? r.v.title : '';
  const to = variant ? r.p.title + ' - ' + variant : r.p.title;
  logAction(tid, 'swap', { title: r.p.title, variant, price: Number(r.v.price) || 0, vendor: r.p.vendor || '', productId: String(r.p.id), variantId: r.v.id ? String(r.v.id) : null, from: m.product.full, from_price: m.product.price },
    `Swapped the subscription from ${m.product.full} (${shopMoney(m.product.price)}) to ${to} (${shopMoney(r.v.price)}), from the next order`);
}
const RC_CANCEL_REASONS = ['This was an accidental subscription', 'I already have more than I need', 'I no longer use this product', 'I want a different product or variety',
  'This is too expensive', 'The product didn\'t work for me', 'Shipping or delivery issues', 'Other reason'];
function openCancel(tid) {
  const m = model(tById(tid));
  modal('Cancel subscription', `<p>Cancel <b>${esc(pname(m))}</b>? No more orders will be created${m.next ? ` (the next one was due ${rcDay(m.next)})` : ''}. Orders already placed are not cancelled or refunded here.</p>
    <label class="fl">Cancellation reason</label><select class="inp" id="cx-r"><option value="">Select a reason</option>${RC_CANCEL_REASONS.map(r => `<option>${esc(r)}</option>`).join('')}</select>
    <label class="fl">Cancellation notes (optional)</label><textarea class="inp" id="cx-n"></textarea>
    <label style="display:flex;gap:8px;align-items:center;margin-top:12px"><input type="checkbox" id="cx-e" checked> Send cancellation email to customer</label>`,
    `<button class="btn" onclick="closeModal()">Go back</button><button class="btn red" onclick="doCancel(${tid})">Cancel subscription</button>`);
}
function doCancel(tid) {
  const m = model(tById(tid)), r = $('cx-r').value;
  if (!r) { $('cx-r').style.borderColor = 'var(--red)'; return; }
  const note = $('cx-n').value.trim();
  logAction(tid, 'cancel', { reason: r, note, email: $('cx-e').checked, next_was: m.next ? isoDay(m.next) : null },
    `Cancelled the subscription to ${pname(m)} (reason: ${r}${note ? '; note: ' + note : ''})${m.next ? '. The order due ' + rcDay(m.next) + ' will no longer be created' : ''}`);
}
function openActivate(tid) {
  const m = model(tById(tid));
  const d = rcAddMonths(m.asAt, 0); d.setDate(d.getDate() + 1);
  modal('Activate subscription', `<p>Reactivate <b>${esc(pname(m))}</b>? The customer will be charged on the next order date.</p>
    <label class="fl">Next order date</label><input class="inp" type="date" id="ac-d" min="${isoDay(d)}" value="${isoDay(rcAddMonths(m.asAt, m.freq))}">`,
    `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" onclick="doActivate(${tid})">Activate</button>`);
}
function doActivate(tid) { const m = model(tById(tid)), v = $('ac-d').value; if (!v) return; logAction(tid, 'activate', { date: v }, `Reactivated the subscription to ${pname(m)}, next order ${rcDay(new Date(v + 'T09:00:00'))}`); }
// Copied word for word from the live Recharge dialog.
function openDelete(tid) {
  modal('Delete subscription', `<p>Are you sure you want to delete this subscription?</p>`,
    `<button class="btn" onclick="closeModal()">Cancel: keep subscription</button><button class="btn red" onclick="doDelete(${tid})">Confirm: delete subscription</button>`);
}
function doDelete(tid) { const m = model(tById(tid)); logAction(tid, 'delete', {}, `Deleted the subscription to ${pname(m)} (deleting removes it entirely; it is not the same as cancelling)`); }
function openProcess(tid) {
  const m = model(tById(tid)), amt = m.product.price * m.product.qty;
  modal('Process order', `<p>Process the order scheduled for <b>${rcDay(m.next)}</b> now?</p>
    <div class="warn">The customer will be charged <b>${shopMoney(amt)}</b> immediately and a new order will be sent to Shopify for fulfilment.</div>`,
    `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" onclick="doProcess(${tid})">Process order</button>`);
}
function doProcess(tid) {
  const m = model(tById(tid)), amt = m.product.price * m.product.qty;
  const no = '#H-98' + String(10000 + (Date.now() % 89999)).padStart(5, '0');   // fake range, see sim-fake-order-numbers
  logAction(tid, 'process', { order_number: no, amount: amt, was_due: isoDay(m.next) }, `Processed the order due ${rcDay(m.next)} NOW: the customer was charged ${shopMoney(amt)} immediately for ${pname(m)} (new order ${no})`);
}
function openAddress(tid) {
  const t = tById(tid), m = model(t), a = m.address;
  const city = a.cityline.split(',')[0].trim(), pc = (a.cityline.match(/[A-Z]{1,2}\d[\dA-Z]?\s*\d[A-Z]{2}/) || [''])[0];
  const parts = m.name.split(' ');
  modal('Edit address', `<div style="display:grid;grid-template-columns:1fr 1fr;gap:0 12px">
      <div><label class="fl">First name</label><input class="inp" id="ad-f" value="${esc(parts[0] || '')}"></div>
      <div><label class="fl">Last name</label><input class="inp" id="ad-l" value="${esc(parts.slice(1).join(' '))}"></div></div>
    <label class="fl">Address</label><input class="inp" id="ad-1" value="${esc(a.street)}">
    <label class="fl">Apartment, suite, etc.</label><input class="inp" id="ad-2" value="">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 12px">
      <div><label class="fl">City</label><input class="inp" id="ad-c" value="${esc(city)}"></div>
      <div><label class="fl">Postcode</label><input class="inp" id="ad-p" value="${esc(pc)}"></div></div>
    <label class="fl">Country</label><select class="inp"><option>United Kingdom</option></select>
    <p class="hint">Changes apply to future orders from this subscription. Orders already in Shopify keep their address.</p>`,
    `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" onclick="doAddress(${tid})">Save</button>`);
}
function doAddress(tid) {
  const m = model(tById(tid)), v = id => $(id).value.trim();
  const street = [v('ad-1'), v('ad-2')].filter(Boolean).join(', ');
  const lines = [street, v('ad-c') + ', ENG ' + v('ad-p'), 'United Kingdom'];
  if (lines.join('|') === m.address.lines.join('|')) { closeModal(); return; }
  logAction(tid, 'edit_address', { lines, from: m.address.lines }, `Changed the subscription address from ${m.address.lines.slice(0, 2).join(', ')} to ${lines.slice(0, 2).join(', ')}`);
}

// Gorgias, Shopify and Recharge share one login, so this signs out of all three.
async function logOut() {
  if (!confirm('Log out? This also signs you out of the Gorgias and Shopify simulators.')) return;
  localStorage.removeItem('trainee');
  try { await db.auth.signOut(); } catch (e) {}
  location.replace('library.html');
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); closeMenus(); } });
// Show a failure instead of hanging on "Loading" (e.g. an old cached sim-shared.js).
init().catch(e => { $('loading').textContent = 'Recharge could not load: ' + (e && e.message || e) + '. Try refreshing with Cmd+Shift+R.'; });
</script>
</body>
</html>
