<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in · Healf Shopify training store</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2395bf47'/%3E%3Cpath d='M20 9c-.1-.1-.3-.1-.4-.1l-1 .2c-.3-.9-.9-1.8-1.9-1.8-.3-.4-.7-.6-1.1-.6-2.6 0-4 3.3-4.4 5l-1.8.6c-.6.2-.6.2-.7.7L7.3 25l12.4 2.1 6.7-1.6C26.4 25.4 20.1 9.5 20 9z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;550;600;650&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; color: #303030; background: #000; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; -webkit-font-smoothing: antialiased; }
.card { width: 100%; max-width: 420px; background: #fff; border-radius: 20px; padding: 32px 32px 26px; box-shadow: 0 24px 60px rgba(0,0,0,.5); }
.brand { display: flex; align-items: center; gap: 10px; margin-bottom: 26px; }
.brand svg { width: 30px; height: 32px; }
.brand .name { font-weight: 650; font-size: 15px; }
.brand .sub { color: #616161; font-size: 12.5px; }
h1 { font-size: 22px; font-weight: 650; letter-spacing: -.2px; margin-bottom: 4px; }
.lead { color: #616161; margin-bottom: 22px; }
label { display: block; font-weight: 500; margin-bottom: 5px; }
input { width: 100%; height: 40px; border: 1px solid #8a8a8a; border-radius: 10px; padding: 0 12px; font: inherit; font-size: 14px; outline: none; background: #fdfdfd; margin-bottom: 14px; }
input:focus { border-color: #1a1a1a; box-shadow: 0 0 0 1px #1a1a1a; }
button { width: 100%; height: 40px; border: none; border-radius: 10px; background: #1a1a1a; color: #fff; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 4px; }
button:hover { background: #303030; }
button:disabled { opacity: .6; cursor: default; }
.err { display: none; background: #fee9eb; color: #8e0b21; border-radius: 10px; padding: 9px 12px; margin-bottom: 14px; }
.note { margin-top: 22px; padding-top: 16px; border-top: 1px solid #ebebeb; color: #616161; font-size: 12px; line-height: 1.5; }
.note a { color: #005bd3; text-decoration: none; } .note a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <svg viewBox="0 0 24 26"><path fill="#95bf47" d="M18.3 5.1c0-.1-.1-.2-.2-.2l-1.9-.1-1.4-1.4c-.1-.1-.4-.1-.5 0l-.7.2C13.2 2.4 12.6 1.4 11.4 1.4h-.1c-.4-.5-.8-.6-1.2-.6C7.3.8 6 4.3 5.6 6l-2 .6c-.6.2-.6.2-.7.8L1.3 20l12.4 2.3 6.7-1.5z"/><path fill="#5e8e3e" d="M18.1 4.9l-1.9-.1-1.4-1.4-.4-.1-1.1 19 6.9-1.5z"/><path fill="#fff" d="M11.6 8.4l-.8 2.4s-.7-.4-1.6-.4c-1.3 0-1.3.8-1.3 1 0 1.1 2.9 1.5 2.9 4.1 0 2-1.3 3.3-3 3.3-2.1 0-3.1-1.3-3.1-1.3l.6-1.8s1.1.9 2 .9c.6 0 .9-.5.9-.9 0-1.4-2.4-1.5-2.4-3.9 0-2 1.4-3.9 4.3-3.9 1.1 0 1.5.5 1.5.5z"/></svg>
    <div><div class="name">Healf</div><div class="sub">Shopify training store</div></div>
  </div>
  <h1>Log in</h1>
  <p class="lead">Continue to the Healf training store</p>
  <div class="err" id="err"></div>
  <label for="email">Email</label>
  <input id="email" type="email" autocomplete="username" placeholder="you@healf.com">
  <label for="pin">Password</label>
  <input id="pin" type="password" autocomplete="current-password" placeholder="Training password">
  <button id="go" onclick="login()">Log in</button>
  <div class="note">This is a practice copy of Shopify for CW training. It uses your Gorgias simulator login, and logging in here signs you into the <a href="practice.html">Gorgias simulator</a> too. Nothing here touches the real Healf store.</div>
</div>
<script>
// Same shared training account as the Gorgias sim's sign-in (index.html).
const TRAINEE_ACCOUNT = 'trainee-access@healf.com';
// Only ever return to a page of this site.
function nextUrl() {
  const n = new URLSearchParams(location.search).get('next') || '';
  return /^shopify\.html(\?|#|$)/.test(n) ? n : 'shopify.html#/orders';
}
function showError(m) { const e = document.getElementById('err'); e.textContent = m; e.style.display = 'block'; }
async function login() {
  const email = document.getElementById('email').value.trim().toLowerCase();
  const pin = document.getElementById('pin').value.trim();
  const btn = document.getElementById('go');
  document.getElementById('err').style.display = 'none';
  if (!email || !pin) { showError('Enter your email and password.'); return; }
  btn.disabled = true; btn.textContent = 'Logging in…';
  const { error: authErr } = await db.auth.signInWithPassword({ email: TRAINEE_ACCOUNT, password: pin });
  if (authErr) { showError('Incorrect password. Try again.'); btn.disabled = false; btn.textContent = 'Log in'; return; }
  const { data, error } = await db.from('trainees').select('*').eq('email', email).single();
  if (error || !data) { showError('No training account found for that email.'); await db.auth.signOut(); btn.disabled = false; btn.textContent = 'Log in'; return; }
  localStorage.setItem('trainee', JSON.stringify(data));
  location.replace(nextUrl());
}
document.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
// Already signed in as a trainee (here or in the Gorgias sim): go straight in.
(async () => {
  try {
    const stored = localStorage.getItem('trainee');
    if (!stored) return;
    const { data: { session } } = await db.auth.getSession();
    if (!session || session.user.email !== TRAINEE_ACCOUNT) return;
    const who = JSON.parse(stored);
    if (!who || !who.id) return;
    location.replace(nextUrl());
  } catch (e) { /* show the form */ }
})();
</script>
</body>
</html>
