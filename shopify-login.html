<!-- Sign-in now lives on the library page (library.html), the one login for every simulator.
     This address is kept so old links and bookmarks keep working. -->
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var next = q.get('next') || 'shopify.html#/orders';
  var out = new URLSearchParams();
  if (q.has('signin')) out.set('signin', '1');
  out.set('next', next);
  location.replace('library.html?' + out.toString());
})();
</script></head><body style="background:#f7f5f3"></body></html>
