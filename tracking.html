<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track your item</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMiAzMiI+PHJlY3Qgd2lkdGg9IjMyIiBoZWlnaHQ9IjMyIiByeD0iNyIgZmlsbD0iIzExMTExMSIvPjxnIHRyYW5zZm9ybT0idHJhbnNsYXRlKDQgNCkiIGZpbGw9Im5vbmUiIHN0cm9rZT0iI2ZmZmZmZiIgc3Ryb2tlLXdpZHRoPSIxLjkiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCI+PHBhdGggZD0iTTMgN2gxMXY5SDN6TTE0IDEwaDRsMyAzdjNoLTciLz48Y2lyY2xlIGN4PSI3IiBjeT0iMTcuNSIgcj0iMS43Ii8+PGNpcmNsZSBjeD0iMTciIGN5PSIxNy41IiByPSIxLjciLz48L2c+PC9zdmc+">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="sim-shared.js"></script>
<style>
/* The courier tracking page a tracking link opens: Royal Mail or Amazon Shipping, as the
   ticket's own text says. Same story as the order and the ticket — see buildTracking(). */
* { box-sizing: border-box; margin: 0; padding: 0; }
:root { --brand: #E3000F; --brand-ink: #fff; --accent: #E3000F; }
body.amazon { --brand: #232f3e; --brand-ink: #fff; --accent: #ff9900; }
body.fedex { --brand: #4d148c; --brand-ink: #fff; --accent: #ff6200; }
.fedex .mark .ex { color: var(--accent); }
body { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; color: #1b1c1d; background: #f4f4f4; min-height: 100vh; -webkit-font-smoothing: antialiased; }
.head { background: var(--brand); color: var(--brand-ink); }
.head-in { max-width: 760px; margin: 0 auto; padding: 16px 20px; display: flex; align-items: center; gap: 10px; }
.mark { font-size: 21px; font-weight: 800; letter-spacing: -.5px; display: flex; align-items: center; gap: 8px; }
.mark small { font-size: 12px; font-weight: 500; opacity: .8; letter-spacing: 0; margin-left: 6px; }
.amazon .mark .sub { color: var(--accent); }
.head-nav { margin-left: auto; font-size: 13px; opacity: .85; }
.wrap { max-width: 760px; margin: 0 auto; padding: 24px 20px 60px; }
h1 { font-size: 24px; font-weight: 800; letter-spacing: -.4px; margin-bottom: 4px; }
.num { color: #555; margin-bottom: 18px; } .num b { color: #1b1c1d; letter-spacing: .4px; }
.card { background: #fff; border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); padding: 20px; margin-bottom: 16px; }
.status { border-radius: 10px; padding: 16px 18px; border: 1px solid; }
.status.green { background: #e7f7ec; border-color: #b7e4c7; } .status.amber { background: #fff7e6; border-color: #fde68a; } .status.grey { background: #f0efed; border-color: #e3e1de; }
.status .s { font-size: 20px; font-weight: 800; } .status .sub { color: #444; margin-top: 2px; }
.status .when { color: #444; margin-top: 8px; font-size: 13px; }
.meta { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; font-size: 13px; }
.meta .k { color: #777; font-size: 12px; } .meta .v { font-weight: 600; }
.sec { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: #888; margin-bottom: 14px; }
.pod { display: grid; grid-template-columns: 220px 1fr; gap: 16px; align-items: start; }
.photo { aspect-ratio: 4 / 3; border-radius: 10px; background: linear-gradient(160deg, #8d8a84, #5d5a55 55%, #4a4844); display: flex; flex-direction: column; align-items: center; justify-content: center; color: #f3f1ee; text-align: center; padding: 14px; gap: 8px; position: relative; overflow: hidden; }
.photo svg { width: 34px; height: 34px; opacity: .9; }
.photo .stamp { position: absolute; left: 8px; bottom: 7px; font-size: 10.5px; opacity: .85; font-variant-numeric: tabular-nums; }
.photo .lbl { font-size: 12px; opacity: .9; }
.pod p { line-height: 1.5; }
.pod .cap { font-weight: 600; margin-bottom: 6px; }
.pod .note { color: #777; font-size: 12px; margin-top: 10px; }
.tl { position: relative; padding-left: 26px; }
.ev { position: relative; padding-bottom: 20px; }
.ev::before { content: ''; position: absolute; left: -26px; top: 3px; width: 12px; height: 12px; border-radius: 50%; background: #c8c5c1; box-shadow: 0 0 0 3px #fff; z-index: 1; }
.ev::after { content: ''; position: absolute; left: -21px; top: 14px; bottom: -3px; width: 2px; background: #e5e3e0; }
.ev:last-child::after { display: none; }
.ev.now::before { background: var(--accent); }
.ev .t { font-weight: 700; } .ev .l { color: #444; font-size: 13px; margin-top: 1px; } .ev .d { color: #888; font-size: 12px; margin-top: 2px; }
.foot { color: #999; font-size: 11.5px; text-align: center; margin-top: 18px; line-height: 1.5; }
.empty { text-align: center; color: #666; padding: 60px 20px; }
@media (max-width: 600px) { .pod { grid-template-columns: 1fr; } .meta { grid-template-columns: 1fr; } h1 { font-size: 21px; } .head-nav { display: none; } }
</style>
</head>
<body>
<div class="head"><div class="head-in"><div class="mark" id="mark">Track your item</div><div class="head-nav" id="nav"></div></div></div>
<div class="wrap" id="main"><div class="empty">Loading tracking…</div></div>
<script>
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const CAM = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-2.5h6L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/></svg>';
(async () => {
  const q = new URLSearchParams(location.search);
  const { data: { session } } = await db.auth.getSession();
  if (!session || !localStorage.getItem('trainee')) {
    location.replace('library.html?next=' + encodeURIComponent('tracking.html' + location.search)); return;
  }
  const { data: t } = await db.from('tickets').select('*').eq('id', Number(q.get('t'))).single();
  if (!t) { document.getElementById('main').innerHTML = '<div class="empty">We couldn’t find that tracking number.</div>'; return; }
  const orders = shopBaseOrders(t);
  const o = orders.find(x => x.number === q.get('o')) || orders[0];
  const tr = buildTracking(t, o);
  const amazon = tr.carrier === 'Amazon Shipping', fedex = tr.carrier === 'FedEx';
  document.body.classList.toggle('amazon', amazon); document.body.classList.toggle('fedex', fedex);
  document.title = tr.carrier + ' · Track your item';
  document.getElementById('mark').innerHTML = amazon ? 'amazon <span class="sub">shipping</span>' : fedex ? 'Fed<span class="ex">Ex</span>' : '<span>♔</span> Royal Mail';
  document.getElementById('nav').textContent = amazon || fedex ? 'Track a package' : 'Track your item';
  const a = custAddress(t);
  const pc = (a.cityline.match(/ENG\s+(.+)$/) || [])[1] || '';
  const evs = tr.events.map((e, i) => `<div class="ev${i === 0 ? ' now' : ''}"><div class="t">${esc(e.title)}</div>${e.loc ? `<div class="l">${esc(e.loc)}</div>` : ''}<div class="d">${esc(fmtTrackDate(e.at))}</div></div>`).join('');
  const podStamp = tr.delivered ? tr.delivered.toLocaleDateString('en-GB') + ' ' + tr.delivered.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }) : '';
  document.getElementById('main').innerHTML = `
    <h1>${esc(tr.headline.s)}</h1>
    <div class="num">Tracking number <b>${esc(tr.num)}</b> · ${esc(tr.service)}</div>
    <div class="card">
      <div class="status ${tr.tone}"><div class="s">${esc(tr.headline.s)}</div><div class="sub">${esc(tr.headline.sub)}</div>
        ${tr.delivered ? `<div class="when">${esc(fmtTrackDate(tr.delivered))}</div>` : ''}</div>
      <div class="meta">
        <div><div class="k">From</div><div class="v">Healf</div></div>
        <div><div class="k">Delivering to</div><div class="v">${esc(pc ? pc.split(' ')[0] + ' area' : 'United Kingdom')}</div></div>
      </div>
    </div>
    ${tr.pod ? `<div class="card"><div class="sec">Proof of delivery</div>
      <div class="pod"><div class="photo">${CAM}<div class="lbl">Delivery photo</div><div class="stamp">${esc(podStamp)}</div></div>
        <div><p class="cap">${esc(tr.pod.caption)}</p><p>This photo was taken by the driver when the item was delivered.</p>
          <p class="note">Training copy: the courier’s photo is described here rather than shown.</p></div></div></div>` : ''}
    <div class="card"><div class="sec">${amazon ? 'Package history' : 'Your item’s journey'}</div><div class="tl">${evs}</div></div>
    <div class="foot">Healf training copy of a courier tracking page, for CW practice only.<br>The real ${esc(tr.carrier)} site is not involved.</div>`;
})();
</script>
</body>
</html>
